name: Verificar demo de triadTech

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Verificar recorridos de la demo
        run: npm test
      - name: Verificar compilación de producción
        run: npm run build:pages
